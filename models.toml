# ---------------------------------------------------------------------------
# Thinking / reasoning capabilities
# ---------------------------------------------------------------------------
# Which reasoning modes each model accepts, and its effort levels.  DAWN sends
# only what a model takes, the WebUI and Aurora show only what it takes, and a
# setting a model can't honor is resolved to the nearest one it can (and the
# client told).  Same longest-prefix matching as the context windows; a model
# with no row gets its provider's conservative default (below each table).
#
#   modes    the reasoning modes the model accepts, in the order shown to users:
#              "disabled"  no reasoning (Claude thinking.type "disabled";
#                          OpenAI effort "none").  Absent = can't be turned off.
#              "adaptive"  Claude adaptive thinking, sized by effort
#              "enabled"   Claude/local: a fixed thinking budget (DAWN's
#                          [llm.thinking] budget_* for low/medium/high/xhigh);
#                          OpenAI/Gemini: reasoning at an effort level
#            An empty list: the model has no reasoning control.
#   efforts  effort levels for "adaptive" (Claude output_config.effort) or, on
#            OpenAI/Gemini, for "enabled"; lowest first.  Claude "enabled" uses
#            the budget levels instead.
#   max_output  the most output tokens (reasoning included) one request may
#            ask for.  A streamed reply that reasons gets a max_tokens by
#            its effort (low 16K, medium 32K, high 64K, xhigh/max 128K), held
#            under this; a model without it, a reply that doesn't reason, and
#            a call that isn't streamed get [llm] max_tokens.  Either way the
#            ceiling is held to the room the context window leaves.
#
# A prefix matches every model it starts, so a family row catches its future
# and specialty variants too: those get a row with no modes (below) until
# they're known.  Better no reasoning parameters than ones a model rejects.
#
# Anthropic rows were read from the Models API (capabilities.thinking/effort)
# and a thinking.type "disabled" probe per model, 2026-09-28 (Claude Haiku 5.5:
# 2026-10-07).  On the 5.x rows "disabled" takes no effort above high; DAWN
# sends no effort with it.  OpenAI and Gemini rows encode DAWN's shipped
# effort rules for those families.  max_output: platform.claude.com models
# overview, developers.openai.com and ai.google.dev model pages, 2026-11-15.

[thinking.anthropic]
"claude-opus-5-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-fable-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-mythos-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 } # each the same model as its Fable
"claude-opus-5" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-sonnet-5-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-haiku-5-5" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-sonnet-5" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-opus-4-8" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-opus-4-7" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"], max_output = 128000 }
"claude-opus-4-6" = { modes = ["disabled", "adaptive", "enabled"], efforts = ["low", "medium", "high", "max"], max_output = 128000 }
"claude-sonnet-4-6" = { modes = ["disabled", "adaptive", "enabled"], efforts = ["low", "medium", "high", "max"], max_output = 128000 }
"claude-opus-4-5" = { modes = ["disabled", "enabled"], efforts = [], max_output = 64000 }
"claude-sonnet-4-5" = { modes = ["disabled", "enabled"], efforts = [], max_output = 64000 }
"claude-haiku-4-5" = { modes = ["disabled", "enabled"], efforts = [], max_output = 64000 }
# Older models, budget thinking only (the 4.5+ rows above are longer, so they win):
