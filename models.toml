"gemini-3.1-pro" = 1048576
"gemini-3-flash" = 1048576
"gemini-3-pro" = 1048576
"gemini-2.5-pro" = 1048576
"gemini-2.5-flash-lite" = 1048576
"gemini-2.5-flash" = 1048576
"gemini-2.0-flash-lite" = 1048576
"gemini-2.0-flash" = 1048576
