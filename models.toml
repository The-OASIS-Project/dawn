# -----------------------------------------------------------------------------
# Pricing.  A row carries base prices, cache multiples, or both:
#   input     $ per million input tokens (list price)
#   output    $ per million output tokens; a row lists both or neither
# and the prompt-cache prices, as multiples of the input price:
#   read      a token read from the provider's prompt cache
#   write_5m  a token written to it with the provider's default lifetime: the
#             one DAWN writes at, and the only write rate it estimates with
#             (Anthropic 5 minutes; OpenAI GPT-5.6 and later 30 minutes)
#   write_1h  a token written with the provider's longer lifetime (Anthropic
#             1 hour; OpenAI GPT-5.6 and later 12 hours, Responses API only).
#             DAWN doesn't ask for it; the rate is listed for completeness.
# 1.0 means no premium (OpenAI before GPT-5.6 and Gemini don't charge for
# writes).  Same longest-prefix matching as the context windows, for each group
# on its own: a row with only cache multiples takes its base prices from the
# longest shorter row that has them, and the other way round.  A model with no
# cache multiples gets its provider's default (Anthropic 0.10/1.25/2.00, OpenAI
# and Gemini 0.10/1.00); a model with no base price gets no cost estimate.
# OpenRouter models ("anthropic/...") use their vendor's table.  Used for
# DAWN's "saved by caching" estimates, cost telemetry and the memory
# re-extraction cost estimate only.
# Sources (list prices, Sep 2026; Anthropic, GPT-6 and Gemini 4 rows Nov 2026):
# platform.claude.com/docs/en/about-claude/pricing (base prices 2026-11-15),
# developers.openai.com model pages (base prices 2026-11-16, prompts up to 272K
# tokens) and /api/docs/pricing (every GPT-5.x, GPT-4.1, o3 and GPT-6.2 row,
# standard tier incl. deprecated models, 2026-11-18; the pro models take no
# cached input), ai.google.dev/gemini-api/docs/pricing.

