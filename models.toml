# DAWN model context-window registry
# =====================================
# Maps a model-id PREFIX to its maximum input context window (in tokens).
#
# Longest-prefix-match wins: DAWN sorts every provider's entries by prefix length
# (descending) at load, so file order does NOT matter — "gpt-5.6" always beats the
# "gpt-5" catch-all regardless of where each line sits.
#
# This file is REFERENCE DATA, not user settings. DAWN reads it once at startup and
# NEVER rewrites it, so it is exempt from the dawn.toml WebUI settings round-trip.
# Edit + restart to update a number or add a model — no rebuild required.
#
# If this file is missing, or a model isn't listed, DAWN falls back to a
# per-provider default (OpenAI/OpenRouter 128K, Claude/Gemini their own). That
# default is conservative — i.e. safe against over-running the window — ONLY for
# models whose real window is >= the default (every modern model). The legacy
# sub-128K entries below (gpt-4 8K, gpt-3.5 16K, gpt-4-32k 32K) would be
# OVER-estimated by the 128K default, so those models require this file present.
# Only the DIRECT providers below live here — OpenRouter and local (llama.cpp/
# Ollama) context windows are fetched LIVE from the provider (/api/v1/models,
# /props) and are intentionally not listed.
#
# Keys must be quoted (model ids contain '.' and '-').
# Sources: developers.openai.com model reference, platform.claude.com (Aug 2026).

[openai]
# GPT-5.6 family — 1,050,000 (gpt-5.6, gpt-5.6-luna, gpt-5.6-sol, ...)
"gpt-5.6" = 1050000
# GPT-5.5 — 1,050,000 API window (the Codex surface caps it at 400K, not the API)
"gpt-5.5" = 1050000
# GPT-5.4 — 256,000
"gpt-5.4" = 256000
# GPT-5.0-5.2 family — 400,000
"gpt-5.2" = 400000
"gpt-5.1" = 400000
"gpt-5-mini" = 400000
"gpt-5-nano" = 400000
"gpt-5" = 400000
# GPT-4.1 family — 1,047,576
"gpt-4.1-mini" = 1047576
"gpt-4.1-nano" = 1047576
"gpt-4.1" = 1047576
# O-series reasoning models
"o4-mini" = 200000
"o3-pro" = 200000
"o3-mini" = 200000
"o3" = 200000
"o1-pro" = 200000
"o1-mini" = 128000
"o1-preview" = 128000
"o1" = 200000
# GPT-4o family
"gpt-4o-mini" = 128000
"gpt-4o" = 128000
# GPT-4 Turbo
"gpt-4-turbo" = 128000
"gpt-4-0125" = 128000
"gpt-4-1106" = 128000
# Legacy GPT-4
"gpt-4-32k" = 32768
"gpt-4" = 8192
# Legacy GPT-3.5
"gpt-3.5-turbo-16k" = 16384
"gpt-3.5-turbo" = 16384

[anthropic]
# 1M context is GA at standard pricing since March 2026 (no beta header). The
# newest flagships carry it; Haiku and older models remain at 200K.
"claude-opus-5" = 1000000
"claude-opus-4-8" = 1000000
"claude-opus-4-7" = 1000000
"claude-opus-4-6" = 1000000
"claude-sonnet-4-6" = 1000000
"claude-sonnet-5-5" = 1000000
"claude-sonnet-5" = 1000000
"claude-fable-5" = 1000000
"claude-mythos-5" = 1000000
# 200K models
"claude-haiku-4-5" = 200000
"claude-opus-4-5" = 200000
"claude-sonnet-4-5" = 200000
"claude-opus-4.5" = 200000
"claude-sonnet-4.5" = 200000
"claude-opus-4.1" = 200000
"claude-sonnet-4.1" = 200000
"claude-opus-4" = 200000
"claude-sonnet-4" = 200000
"claude-3-5-sonnet" = 200000
"claude-3-5-haiku" = 200000
"claude-3.5" = 200000
"claude-3-opus" = 200000
"claude-3-sonnet" = 200000
"claude-3-haiku" = 200000

[gemini]
# All current Gemini families use a 1,048,576 (1M) input window.
"gemini-3.1-pro" = 1048576
"gemini-3-flash" = 1048576
"gemini-3-pro" = 1048576
"gemini-2.5-pro" = 1048576
"gemini-2.5-flash-lite" = 1048576
"gemini-2.5-flash" = 1048576
"gemini-2.0-flash-lite" = 1048576
"gemini-2.0-flash" = 1048576
"gemini-1.5-pro" = 1048576
"gemini-1.5-flash" = 1048576

# -----------------------------------------------------------------------------
# Prompt-cache pricing, as multiples of each model's base input price:
#   read      a token read from the provider's prompt cache
#   write_5m  a token written to it with the default 5-minute lifetime
#   write_1h  a token written with the 1-hour lifetime
# 1.0 means no premium (OpenAI before GPT-5.6 and Gemini don't charge for
# writes).  Same longest-prefix matching as the context windows; a model not
# listed gets its provider's default (Anthropic 0.10/1.25/2.00, OpenAI and
# Gemini 0.10/1.00).  OpenRouter models ("anthropic/...") use their vendor's
# table.  Used for DAWN's "saved by caching" estimates and cost telemetry only.
# Sources (list prices, Sep 2026): platform.claude.com, developers.openai.com
# /api/docs/pricing, ai.google.dev/gemini-api/docs/pricing.

[cache_pricing.anthropic]
"claude-opus-5-5" = { read = 0.05, write_5m = 1.25, write_1h = 2.0 }   # $0.20 on $4
"claude-fable-5-1" = { read = 0.025, write_5m = 1.25, write_1h = 2.0 } # $0.25 on $10
# Mythos 5.1 shares Fable 5.1's price, but whether its cache reads do was open
# at launch: the default (0.10) until confirmed.
"claude" = { read = 0.10, write_5m = 1.25, write_1h = 2.0 }

[cache_pricing.openai]
"gpt-5.6" = { read = 0.10, write_5m = 1.25, write_1h = 1.25 } # sol, terra, luna
"gpt-5" = { read = 0.10, write_5m = 1.0, write_1h = 1.0 }     # 5.0-5.5, mini, nano
"gpt-4.1" = { read = 0.25, write_5m = 1.0, write_1h = 1.0 }
"o3" = { read = 0.25, write_5m = 1.0, write_1h = 1.0 }
"o4-mini" = { read = 0.25, write_5m = 1.0, write_1h = 1.0 }
"gpt-4o" = { read = 0.50, write_5m = 1.0, write_1h = 1.0 }

[cache_pricing.gemini]
"gemini" = { read = 0.10, write_5m = 1.0, write_1h = 1.0 } # 2.5 and 3.x families


# ---------------------------------------------------------------------------
# Thinking / reasoning capabilities
# ---------------------------------------------------------------------------
# Which reasoning modes each model accepts, and its effort levels.  DAWN sends
# only what a model takes, the WebUI and Aurora show only what it takes, and a
# setting a model can't honor is resolved to the nearest one it can (and the
# client told).  Same longest-prefix matching as the context windows; a model
# with no row gets its provider's conservative default (below each table).
#
#   modes    the reasoning modes the model accepts, in the order shown to users:
#              "disabled"  no reasoning (Claude thinking.type "disabled";
#                          OpenAI effort "none").  Absent = can't be turned off.
#              "adaptive"  Claude adaptive thinking, sized by effort
#              "enabled"   Claude/local: a fixed thinking budget (DAWN's
#                          [llm.thinking] budget_* for low/medium/high/xhigh);
#                          OpenAI/Gemini: reasoning at an effort level
#            An empty list: the model has no reasoning control.
#   efforts  effort levels for "adaptive" (Claude output_config.effort) or, on
#            OpenAI/Gemini, for "enabled"; lowest first.  Claude "enabled" uses
#            the budget levels instead.
#
# A prefix matches every model it starts, so a family row catches its future
# and specialty variants too: those get a row with no modes (below) until
# they're known.  Better no reasoning parameters than ones a model rejects.
#
# Anthropic rows were read from the Models API (capabilities.thinking/effort)
# and a thinking.type "disabled" probe per model, 2026-09-28.  OpenAI and
# Gemini rows encode DAWN's shipped effort rules for those families.

[thinking.anthropic]
"claude-opus-5-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-fable-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-opus-5" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-sonnet-5-5" = { modes = ["adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-sonnet-5" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-opus-4-8" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-opus-4-7" = { modes = ["disabled", "adaptive"], efforts = ["low", "medium", "high", "xhigh", "max"] }
"claude-opus-4-6" = { modes = ["disabled", "adaptive", "enabled"], efforts = ["low", "medium", "high", "max"] }
"claude-sonnet-4-6" = { modes = ["disabled", "adaptive", "enabled"], efforts = ["low", "medium", "high", "max"] }
"claude-opus-4-5" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-sonnet-4-5" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-haiku-4-5" = { modes = ["disabled", "enabled"], efforts = [] }
# Older models, budget thinking only (the 4.5+ rows above are longer, so they win):
"claude-opus-4-1" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-opus-4" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-sonnet-4" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-3-7-sonnet" = { modes = ["disabled", "enabled"], efforts = [] }
"claude-3" = { modes = [], efforts = [] } # 3.5 and earlier: no extended thinking
# Default for an unlisted Claude model: adaptive, low/medium/high, no "disabled".

[thinking.openai]
"gpt-5.6" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high", "xhigh"] }
"gpt-5.5" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high", "xhigh"] }
"gpt-5.4" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high", "xhigh"] }
"gpt-5.3" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high", "xhigh"] }
"gpt-5.2" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high", "xhigh"] }
"gpt-5.1" = { modes = ["disabled", "enabled"], efforts = ["low", "medium", "high"] }
"gpt-5" = { modes = ["enabled"], efforts = ["minimal", "low", "medium", "high"] } # 5, mini, nano
"gpt-5." = { modes = [], efforts = [] } # a gpt-5.x newer than the rows above: unknown until listed
"gpt-5-chat" = { modes = [], efforts = [] } # the chat alias takes no reasoning parameter
"o1" = { modes = ["enabled"], efforts = ["low", "medium", "high"] }
"o1-mini" = { modes = [], efforts = [] } # takes no reasoning_effort
"o1-preview" = { modes = [], efforts = [] }
"o3" = { modes = ["enabled"], efforts = ["low", "medium", "high"] }
"o4-mini" = { modes = ["enabled"], efforts = ["low", "medium", "high"] }
"gpt-4" = { modes = [], efforts = [] } # 4o, 4.1: no reasoning
# Default for an unlisted OpenAI model: no reasoning control (nothing sent).
# An OpenAI-compatible endpoint can serve anything, so only models listed
# here get reasoning parameters.

[thinking.gemini]
"gemini-3" = { modes = ["enabled"], efforts = ["low", "medium", "high"] }
"gemini-2.5" = { modes = ["enabled"], efforts = ["low", "medium", "high"] }
"gemini-2.5-flash-image" = { modes = [], efforts = [] } # image generation: no reasoning
# Default for an unlisted Gemini model: no reasoning control.
#
# OpenRouter models ("vendor/model") use their vendor's table: anthropic/,
# openai/, google/ (Gemini).  Other vendors default to "disabled" + "enabled",
# low/medium/high (OpenRouter ignores the setting where it doesn't apply).
# Local models aren't listed: llama.cpp takes "disabled" + "enabled" (budget),
# Ollama "disabled" + "enabled" with no levels.


# ---------------------------------------------------------------------------
# Mid-conversation system messages
# ---------------------------------------------------------------------------
# The Anthropic models that take a {"role": "system"} message inside `messages`
# (after a user turn).  DAWN sends a conversation's operator directions and
# instruction changes that way on these models, so the frozen system prompt
# stays byte for byte what the conversation started with.  Any other model gets
# them as an "[Operator note]" in the user turn, which every model takes.
# Prefixes, matched like the tables above.  Source: platform.claude.com
# (mid-conversation system messages), Sep 2026; Claude Sonnet 5 doesn't take them.

[mid_system]
anthropic = ["claude-opus-5", "claude-opus-4-8", "claude-fable-5", "claude-mythos-5"]

# ---------------------------------------------------------------------------
# The Anthropic models that take a tool defined inside a {"role": "system"}
# message (a `tool_addition` whose tool is a `tool_definition`, beta
# inline-tools-2026-09-15, Claude API only).  On these, a tool an MCP server
# adds or changes mid-conversation is sent where it happened, so the
# conversation's `tools` stay byte for byte what it started with and its
# reasoning stays valid.  Any other model (or another host) gets the change
# folded into `tools`, a declared boundary.  Same models as [mid_system].
# Prefixes, matched like the tables above.  Source: platform.claude.com
# (mid-conversation system messages and tool changes), Sep 2026.

[inline_tools]
anthropic = ["claude-opus-5", "claude-opus-4-8", "claude-fable-5", "claude-mythos-5"]

# -----------------------------------------------------------------------------
# The images one request may carry, per vendor: `count` images, `bytes` of them
# as sent (base64).  A tool's image (a camera capture) past either is refused
# for that turn, and a history nearing either is compacted at the next turn's
# seam (its oldest images are summarized away).  `count` is the vendor's
# per-request limit; `bytes` stays under the vendor's request-size limit with
# room for the rest of the request.  Keys: a vendor family ("anthropic_200k":
# a Claude model with a 200K window), "other" (another OpenRouter vendor),
# "local" (llama.cpp / Ollama: no vendor limit; DAWN's conservative choice).
# Sources (Oct 2026): platform.claude.com vision (600 per request, 100 for
# 200K-window models; 32 MB request body), developers.openai.com images-vision
# (1,500 images, 512 MB payload), ai.google.dev image-understanding (3,600
# images; 20 MB inline request).

[max_request_images]
anthropic = { count = 600, bytes = 24000000 }
anthropic_200k = { count = 100, bytes = 24000000 }
openai = { count = 1500, bytes = 256000000 }
gemini = { count = 3600, bytes = 16000000 }
other = { count = 20, bytes = 16000000 }
local = { count = 16, bytes = 64000000 }
