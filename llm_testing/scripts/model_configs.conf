# Qwen3.8-27B-Q4_K_M (Vision, dense) — NOT YET BENCHMARKED
# - HuggingFace: bartowski/Qwen3.8-27B-GGUF
# - NOTE the filename change: bartowski dropped the "Qwen_" repo prefix this
#   generation. It is Qwen3.8-27B-Q4_K_M.gguf, NOT Qwen_Qwen3.8-27B-Q4_K_M.gguf.
#   get_model_config.sh matches on the exact filename, so the old naming misses.
# - REQUIRES llama.cpp b10419+ to LOAD THIS GGUF (a model requirement; the
#   --reasoning flag itself only needs b8287+). Box was on b8667 as of 2026-08-16.
# - 27B dense, 64 layers as 16 x (3 x Gated-DeltaNet -> 1 x Gated-Attention).
#   Only 16/64 layers carry a KV cache: 64 KB/token at f16, ~34 KB/token at
#   the q8_0 cache type DAWN uses. Native context 262144 (1M via YaRN).
# - Requires mmproj: mmproj-Qwen3.8-27B-f16.gguf
# - Model ~17.8 GB. At ctx 32768 + KV q8_0 the resident set is ~19.8 GB;
#   128K is ~23 GB and 262K is ~27.5 GB — all fit on AGX Orin 64GB.
# - Qwen recommended (non-thinking): temp=0.7, top_p=0.80, top_k=20, min_p=0.0,
#   repetition_penalty=1.0, PRESENCE_PENALTY=1.5  <-- new, non-default knob,
#   called out specifically for non-thinking mode on the model card.
# - Qwen recommended (thinking): temp=1.0, top_p=0.95, top_k=20, presence=0.0
# - Thinking is ON by default in the built-in template — the same trap that
#   scored Qwen 3.6 35B-A3B at 18% (empty `content`, all generation siphoned
#   into reasoning_content under the harness's 150-token cap). Template source
#   confirms `enable_thinking is undefined or enable_thinking is true`, so
#   --reasoning off is the correct hard-off.
#   Qwen 3.8 also adds a `reasoning_effort` dial (xhigh default / medium / low)
#   if a graded run is wanted instead of a hard off.
# - Context 32768 here for apples-to-apples with Qwen 3.6 27B (Preset I).
#   Run the context-scaling pass separately before raising it.
# - Expected ~7 tok/s (same weight class + attention layout as Qwen 3.6 27B at
#   7.0 tok/s) — WebUI tier, not voice. Confirm, do not assume.
Qwen3.8-27B-Q4_K_M.gguf|99|32768|768|768|4|0.7|0.8|20|1.0|--flash-attn on --min-p 0 --presence-penalty 1.5 --reasoning off

# Qwen3.8-27B-UD-Q4_K_M (Vision, dense) — unsloth Dynamic quant, ON DISK 2026-08-27
