# Model-Specific Configuration for llama-server
# Updated: April 2025
#
# Each model has optimized settings based on:
# - HuggingFace model card recommendations
# - llama.cpp best practices
# - Empirical testing results (see llm_testing/docs/MODEL_TEST_ANALYSIS.md)
#
# IMPORTANT: Jetson AGX Orin must be in MAXN power mode for rated speeds:
#   sudo nvpmodel -m 0 && sudo jetson_clocks
#
# ALL speed/quality figures below come from ONE sweep on 2026-09-03:
# llama.cpp b10626, Jetson AGX Orin 64GB @ MAXN (60W), 116-point FRIDAY suite,
# run via test_single_model.sh. One build / one machine / one suite, so the
# models are comparable with each other -- which was NOT true of the numbers
# this file carried before (they spanned b8667..b10626 and two hardware
# generations). Quality has ~+/-3 points of run-to-run variance at temp 0.7.
# TTFT figures quoted here are on the harness's ~66-token prompts, not DAWN's
# full ~1000-token system prompt.
#
# RECOMMENDED (voice, no vision): Qwen3-4B-Instruct-2507-Q4_K_M (bartowski)
#   - Quality: 94.8% (A) | Speed: 36.71 tok/s | TTFT 45-59 ms (best of any preset)
#
# RECOMMENDED (voice + vision, 64GB): Qwen_Qwen3.6-35B-A3B-Q4_K_M ⭐
#   - Quality: 94.0% (A) (91.4-94.0 over 4 runs) | Speed: 37.0-37.2 tok/s
#   - Fastest model scoring >=94%. Stable alt: Qwen3.5-35B-A3B (91.4%, 34.97).
#
# RECOMMENDED (voice + vision, 16GB): Gemma 3 4B IT ⭐
#   - Quality: 89.7% (B) | Speed: 37.93 tok/s (64GB) | 13.9 tok/s (16GB 28W)
#
# HIGHEST QUALITY (any local model): google_gemma-4-31B-it-Q4_K_M
#   - Quality: 97.4% (A) -- above Claude Haiku/Sonnet (96.5%) on this suite
#   - But 6.75 tok/s: WebUI only. Vision/tool-calling unverified on b10626.
#
# GEMMA 4 (thinking issue resolved by --reasoning off; re-measured 2026-09-03):
#   Gemma 4 26B-A4B: 93.1% (A), 31.48 tok/s — voice-viable on text
#   Gemma 4 31B:     97.4% (A),  6.75 tok/s — highest local quality measured
#   Both still need vision (#21402) and tool-calling (#21375) re-verified on
#   b10626 before either can be promoted; those were open as of April.
#
# QWEN 3.8 (re-measured in the 2026-09-03 sweep, 3 runs total):
#   Qwen3.8-27B UD: 94.0% (A) median (93.1-95.7), 8.28 tok/s. Its quality is
#   statistically indistinguishable from Preset J (94.0%, 91.4-94.0) -- an
#   earlier note here claiming it "loses to Preset J on quality" was wrong.
#   It stays WebUI-tier purely on speed: 8.28 vs 37.1 tok/s. No Qwen 3.8 MoE
#   exists in the 35B-A3B class, so 3.8 does not replace Preset J for voice.
#
# THINKING CONTROL — needs llama.cpp b8287+ (2026-08-27 migration):
#   b10626 deprecated --chat-template-kwargs {"enable_thinking":false} in favour
#   of --reasoning on|off|auto, and renamed the env var it used
#   (LLAMA_CHAT_TEMPLATE_KWARGS -> LLAMA_ARG_CHAT_TEMPLATE_KWARGS). All rows for
#   thinking-capable Qwen models now pass --reasoning off. Only the Qwen 3.6
#   rows are verified on b10626; the Qwen 3.5 rows had NO disable before and are
#   inferred from the same template behaviour — re-benchmark them.
#
#   Symptom if this is ever dropped: empty `content`, generation siphoned into
#   `reasoning_content`, ~20% quality at normal speed.
#
# CLOUD BASELINES (same 13-test FRIDAY suite, for reference):
#   Claude Opus 4.7:   99.1% (A) — cloud flagship
#   Claude Haiku 4.5:  96.5% (A) — cloud
#   Claude Sonnet 4.6: 96.5% (A) — cloud
#   Best local (35B-A3B) is within 1.7% of Haiku/Sonnet, 4.3% of Opus.
#
# SPECULATIVE DECODING: DO NOT USE FOR DAWN
#   - Testing showed 40% SLOWER with DAWN's prompt structure
#   - Long system prompt (90 tokens) + short responses = worst case for spec decoding
#   - See MODEL_TEST_ANALYSIS.md for full analysis

# NOT BENCHMARKABLE ON THIS SUITE: Qwen3-4B-Thinking-2507 (llama-server Preset B).
# test_llm_quality.py caps generation at max_tokens=150. A thinking model spends
# that budget inside <think> before emitting an answer, so `content` comes back
# empty or truncated and it scores ~20% — indistinguishable from the failure
# signature of a NON-thinking model with thinking left on. The number would be an
# artefact of the harness, not a property of the model, so Preset B deliberately
# has no row here and its quality stays "TBD". Measuring it needs a suite variant
# with a much larger token budget.
#
# Format: MODEL_NAME|gpu_layers|context|batch|ubatch|threads|temp|top_p|top_k|repeat_penalty|extra_flags

