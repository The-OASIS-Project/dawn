name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Format Check (~30s)
  # Runs on ubuntu-22.04 which has clang-format-14 available
  # -------------------------------------------------------------------------
  format-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install clang-format-14
        run: |
          # Drop the runner's pre-installed Google Chrome apt repo before
          # updating: it periodically serves a Packages index that mismatches
          # its InRelease hash, which fails `apt-get update` (exit 100) and
          # takes the whole job with it. DAWN's build needs nothing from it.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome*
          sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Install Prettier
        run: npm install

      - name: Check formatting
        run: ./format_code.sh --check

      # Outbound markdown funnel invariant: every driver->send_text() CALL must
      # go through the messaging_deliver / engine_send_async funnel (which
      # renders the canonical markdown into the driver's out_format + escapes
      # it).  A direct call from anywhere else would ship raw markdown and, for
      # Telegram (parse_mode=HTML), get the whole message rejected with HTTP
      # 400.  Drivers are not reachable outside src/messaging (find_driver is
      # engine-internal), so only these three files may call send_text.
      - name: Messaging send_text funnel invariant
        run: |
          bad=$(grep -rn -- '->send_text(' src/messaging/ \
            | grep -vE 'messaging_engine\.c|messaging_engine_link\.c|messaging_engine_inbound\.c' \
            || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "ERROR: driver->send_text() called outside the messaging_deliver funnel."
            echo "Route outbound replies through messaging_deliver() or messaging_engine_send()."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Job 2: Unit Tests (~2 min)
  # Uses ci CMake preset: WEBUI=OFF, TUI=OFF, AEC=OFF, VOSK=ON
  # No submodules needed (VOSK=ON skips whisper.cpp submodule)
  # -------------------------------------------------------------------------
  unit-tests:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          # See format-check job: drop the flaky Google Chrome apt repo first.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libjson-c-dev libssl-dev libsqlite3-dev \
            libsodium-dev libspdlog-dev libmosquitto-dev \
            libflac-dev libsamplerate0-dev libsndfile1-dev \
            libmpg123-dev libvorbis-dev \
            libmupdf-dev libfreetype-dev libharfbuzz-dev libzip-dev libxml2-dev \
            libmujs-dev libgumbo-dev libopenjp2-7-dev libjbig2dec0-dev libjpeg-dev \
            libical-dev \
            libstemmer-dev

      - name: Configure (ci preset)
        run: cmake --preset ci

      - name: Build CI tests
        run: make -C build-ci -j"$(nproc)" tests-ci

      - name: Run tests
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error -L ci

  # -------------------------------------------------------------------------
  # Job 3: Docker Build (~10 min)
  # Builds full image (deps + server compile + runtime) and smoke tests it.
  # This is the CI home of the daemon link+start smoke (the `dawn --help` run):
  # the daemon unconditionally links ONNX Runtime + Piper, which aren't apt
  # packages, so this image is the only place on stock runners the full binary
  # links and runs. It replaces the server-config slice of the old pre-push
  # preset-matrix smoke; the WEBUI-off / +email ML variants stay a developer
  # release-time check (./tests/smoke_test.sh on hardware).
  # -------------------------------------------------------------------------
  docker-build:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t dawn .

      - name: Smoke test (daemon links + starts)
        run: docker run --rm dawn --help

  # -------------------------------------------------------------------------
  # Job 4: Tier 1 Satellite Build (~1 min)
  # Headless config (no ML deps): VAD/ASR/TTS/SDL all OFF, so it builds with
  # apt-only libs (lws, json-c, alsa, opus) — no ONNX Runtime / Vosk / whisper.
  # Compiles ws_client.c + main.c + voice_processing.c, which is exactly where
  # config-gated breakage hides (e.g. an unconditional include resolved only in
  # the SDL build, or a VAD-off path calling vad_silero_cleanup unguarded). The
  # full ML build is exercised by the developer's pre-push hook on hardware.
  # -------------------------------------------------------------------------
  satellite-build:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          # See format-check job: drop the flaky Google Chrome apt repo first.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libwebsockets-dev libjson-c-dev libasound2-dev libopus-dev \
            libcurl4-openssl-dev libsodium-dev

      - name: Configure (headless Tier 1, no ML deps)
        run: >
          cmake -S dawn_satellite -B dawn_satellite/build-ci
          -DENABLE_VAD=OFF -DENABLE_WHISPER_ASR=OFF -DENABLE_VOSK_ASR=OFF
          -DENABLE_TTS=OFF -DENABLE_SDL_UI=OFF -DENABLE_DISPLAY=OFF

      - name: Build
        run: make -C dawn_satellite/build-ci -j"$(nproc)"

  # -------------------------------------------------------------------------
  # Job 5: ESP32 satellite compile gate (~2-3 min cold)
  # Tier-2 Arduino firmware — catches build breakage on every push, mirroring
  # the satellite-build gate for Tier 1.  NOT a release-artifact producer: the
  # sketch bakes WiFi creds + server IP + CA cert + verify key at compile time,
  # so a generic .bin isn't flashable.  build-esp32.sh --stub drops in
  # placeholder headers purely so a fresh checkout compiles; the FQBN + library
  # list live in that one script (shared with local builds).  Real release .bin
  # is operator-built with real headers (see dawn_satellite_arduino/README.md).
  # -------------------------------------------------------------------------
  esp32-build:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install arduino-cli (pinned version + sha256)
        run: |
          ver=1.5.1
          sha=28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            "https://github.com/arduino/arduino-cli/releases/download/v${ver}/arduino-cli_${ver}_Linux_64bit.tar.gz"
          echo "${sha}  /tmp/arduino-cli.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli

      # Cache the esp32 core + xtensa toolchain + libraries (~200 MB download).
      # Keyed on build-esp32.sh, which holds the core/lib/FQBN list — bump that
      # script and the cache re-populates.  Cold ~2-3 min, warm ~20-40 s.
      - name: Cache ~/.arduino15
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.arduino15
          key: esp32-arduino15-${{ runner.os }}-${{ hashFiles('dawn_satellite_arduino/build-esp32.sh') }}
          restore-keys: |
            esp32-arduino15-${{ runner.os }}-

      - name: Compile (stub headers — gate only)
        run: bash dawn_satellite_arduino/build-esp32.sh --stub
