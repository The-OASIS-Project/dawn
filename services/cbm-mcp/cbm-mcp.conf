# Codebase Memory MCP (cbm-mcp) — systemd EnvironmentFile
#
# Loaded by cbm-mcp.service. Edit and restart:
#   sudo systemctl restart cbm-mcp
#
# This service runs codebase-memory-mcp (cbm), a stdio MCP server, behind
# mcp-proxy, which re-exposes it over SSE so DAWN's MCP bridge (HTTP+SSE client)
# can connect. See README.md for the full architecture.

# Path to the mcp-proxy executable. install.sh creates a dedicated venv here so
# the adapter has a stable path independent of any user's ~/.local or nvm node.
MCP_PROXY=/usr/local/lib/cbm-mcp/venv/bin/mcp-proxy

# Path to the cbm binary, built from codebase-memory-mcp with libgit2 disabled
# (cbm's optional libgit2 fast-path doesn't compile against a system libgit2 —
# it falls back to `git log`, which is functionally complete). See README.md.
CBM_BIN=/usr/local/bin/codebase-memory-mcp

# SSE bind address — LOCALHOST ONLY. cbm has no authentication of its own, so
# this port must never be exposed off-box. DAWN connects to
# http://${HOST}:${PORT}/sse (set the same in dawn.toml's [[mcp.server]]).
HOST=127.0.0.1
PORT=9750

# Where cbm stores its graph database (SQLite, WAL). Must be writable by the
# dawn user and is listed in the service's ReadWritePaths.
CBM_CACHE_DIR=/var/lib/dawn/cbm-cache

# cbm log verbosity: debug | info | warn | error | none
CBM_LOG_LEVEL=info

# Optional: override cbm's parallel-indexing worker count (blank = auto-detect).
# Useful on constrained hardware to cap CPU during a large index.
CBM_WORKERS=
