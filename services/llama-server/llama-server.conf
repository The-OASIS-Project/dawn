# --- PRESET J: Qwen 3.6 35B-A3B Vision, MoE (AGX Orin 64GB) ⭐ RECOMMENDED ---
# Multimodal (text + vision), MoE, Apache 2.0. Successor to Qwen 3.5 35B-A3B.
# Quality: 94.0% (A) | 37.0-37.2 tok/s — fastest model scoring >= 94%
# Vision verified working. 131072 context confirmed working — same flat
# scaling as F (architectural inheritance from Qwen 3.5 SSM hybrid).
#
# IMPORTANT: Qwen 3.6 family ships with thinking ON by default in the chat
# template. Without disabling it, generation gets routed entirely into
# reasoning_content under short max_tokens (empty `content`, ~20% quality
# on the FRIDAY suite). Set REASONING_MODE=off -> --reasoning off.
#
# This replaced LLAMA_CHAT_TEMPLATE_KWARGS on 2026-08-27: llama.cpp b10626
# deprecated the {"enable_thinking":false} spelling AND renamed that env var
# to LLAMA_ARG_CHAT_TEMPLATE_KWARGS, so the old line was silently ignored and
# thinking came back ON with nothing failing. Requires b10419+.
# Download:
#   hf download bartowski/Qwen_Qwen3.6-35B-A3B-GGUF Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf --local-dir /var/lib/llama-cpp/models/
#   hf download bartowski/Qwen_Qwen3.6-35B-A3B-GGUF mmproj-Qwen_Qwen3.6-35B-A3B-f16.gguf --local-dir /var/lib/llama-cpp/models/
#MODEL="/var/lib/llama-cpp/models/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf"
#TEMPLATE=
#REASONING_FORMAT=deepseek
#REASONING_MODE=off
#MMPROJ="/var/lib/llama-cpp/models/mmproj-Qwen_Qwen3.6-35B-A3B-f16.gguf"

# --- PRESET K: Qwen 3.8 27B Vision, dense (AGX Orin 64GB) — NOT YET BENCHMARKED ---
# Successor to Preset I (Qwen 3.6 27B). Dense 27B, 64 layers arranged as
# 16 x (3 x Gated-DeltaNet -> 1 x Gated-Attention), multimodal, Apache 2.0.
# Native context 262144 (1M via YaRN). Requires ~17.8GB model + ~0.9GB mmproj.
# Quality: 94.0% (A) median over 3 runs (93.1-95.7) | 8.28 tok/s.
# Ties Preset J on quality; WebUI tier purely on speed (8.28 vs 37.1).
#
# REQUIRES llama.cpp b10419 or newer. Older builds will not load this GGUF.
#
# Note there is NO Qwen 3.8 MoE in the 35B-A3B class — the only other open 3.8
# model is 2.4T-A95B, which does not fit. Qwen 3.8 therefore does not offer a
# replacement for Preset J; this preset competes with Preset I only.
#
# IMPORTANT (same trap as Preset J): thinking is ON by default in the built-in
# template, which siphons generation into reasoning_content and empties
# `content` under short max_tokens. Disable via REASONING_MODE=off.
# Qwen 3.8 also adds a `reasoning_effort` dial (xhigh default / medium / low)
# if a graded run is wanted instead of a hard off.
#
# PRESENCE_PENALTY=1.5 is Qwen's documented non-thinking recommendation and is
# non-default (llama.cpp defaults to 0.0). For thinking mode Qwen instead
# recommends temp=1.0, top_p=0.95, top_k=20, presence=0.0.
#
# Filename note: bartowski dropped the "Qwen_" prefix this generation.
# Download:
#   hf download bartowski/Qwen3.8-27B-GGUF Qwen3.8-27B-Q4_K_M.gguf --local-dir /var/lib/llama-cpp/models/
#   hf download bartowski/Qwen3.8-27B-GGUF mmproj-Qwen3.8-27B-f16.gguf --local-dir /var/lib/llama-cpp/models/
#MODEL="/var/lib/llama-cpp/models/Qwen3.8-27B-Q4_K_M.gguf"
#TEMPLATE=
#REASONING_FORMAT=deepseek
#REASONING_MODE=off
#MMPROJ="/var/lib/llama-cpp/models/mmproj-Qwen3.8-27B-f16.gguf"
#CONTEXT_SIZE=32768
#PRESENCE_PENALTY=1.5

