# gcovr settings, read automatically when gcovr runs from the repository root.
#
#   cmake --preset coverage
#   make -C build-coverage -j"$(nproc)" tests-ci
#   ctest --test-dir build-coverage -j"$(nproc)" -L ci
#   gcovr build-coverage --print-summary
#
# For the HTML report: mkdir -p build-coverage/report, then add
# --html-details build-coverage/report/index.html.
#
# Counts DAWN's own code (daemon, shared library, satellite); leaves out the tests
# themselves and vendored code. Unit-test coverage only: the WebUI and network
# paths are exercised by the integration scripts, which this doesn't run.

# The build directory goes on the command line: gcovr 5.0 (Ubuntu 22.04's, which CI
# uses) misreads a search-path given here.
root = .
filter = src/
filter = common/
filter = dawn_satellite/
exclude = third_party/
exclude = tests/
